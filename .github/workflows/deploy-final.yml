name: Deploy final QIQO website

on:
  push:
    paths:
      - 'deploy-final/READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble package
        shell: bash
        run: |
          set -euo pipefail
          cat deploy-final/package.b64.part* | base64 --decode > /tmp/qiqo.zip
          mkdir -p /tmp/qiqo
          unzip -q /tmp/qiqo.zip -d /tmp/qiqo
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/qiqo/index.html
          test -f /tmp/qiqo/people.html
          test -f /tmp/qiqo/assets/js/data.js
          test -f /tmp/qiqo/assets/js/people-data.js
          grep -q 'Principal Investigator' /tmp/qiqo/assets/js/data.js
          grep -q 'Quantum receivers' /tmp/qiqo/assets/js/people-data.js
          grep -q 'Physical Unclonable Functions' /tmp/qiqo/assets/js/people-data.js
          grep -q 'Content and media notice' /tmp/qiqo/NOTICE.md
      - name: Replace repository and commit
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/qiqo/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy QIQO website v6 for publication'
          git push origin HEAD:main
