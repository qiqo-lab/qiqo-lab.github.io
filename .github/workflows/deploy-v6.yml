name: Deploy QIQO website v6

on:
  push:
    paths:
      - 'deploy-v6/READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and validate v6 package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, zipfile

          parts = sorted(Path('deploy-v6').glob('package.b64.part*'))
          if not parts:
              raise SystemExit('No package parts found')

          chunks = []
          for p in parts:
              raw = p.read_text(encoding='utf-8')
              compact = ''.join(raw.split())
              if re.fullmatch(r'[A-Za-z0-9+/=]+', compact):
                  chunk = compact
              else:
                  runs = re.findall(r'[A-Za-z0-9+/=]{100,}', compact)
                  if not runs:
                      raise SystemExit(f'No base64 payload found in {p}')
                  chunk = max(runs, key=len)
              print(f'{p}: raw={len(raw)} payload={len(chunk)}')
              chunks.append(chunk)

          payload = ''.join(chunks)
          try:
              data = base64.b64decode(payload, validate=True)
          except Exception as exc:
              raise SystemExit(f'Base64 validation failed: {exc}; payload length={len(payload)}')

          out = Path('/tmp/qiqo-v6.zip')
          out.write_bytes(data)
          with zipfile.ZipFile(out) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              zf.extractall('/tmp/qiqo-v6')
              print(f'Validated ZIP with {len(zf.infolist())} entries')
          PY

      - name: Replace repository with validated v6 site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/deploy-v6.yml' \
            /tmp/qiqo-v6/ ./

      - name: Commit v6 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository already matches v6.'
            exit 0
          fi
          git commit -m 'Deploy QIQO website v6'
          git push origin HEAD:main
