name: Deploy QIQO website v6

on:
  push:
    paths:
      - 'deploy-v6/READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose packaged chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path('deploy-v6').glob('package.b64.part*')):
              raw=p.read_text()
              ms=list(re.finditer(r'[A-Za-z0-9+/=]{100,}', ''.join(raw.split())))
              print(p, 'raw', len(raw), 'runs', [len(m.group(0)) for m in ms])
              if len(raw)>10000:
                  mraw=list(re.finditer(r'[A-Za-z0-9+/=]{100,}', raw))
                  print('raw-runs', [(m.start(),m.end(),len(m.group(0))) for m in mraw])
                  if len(mraw)>=2:
                      print('gap=',repr(raw[mraw[0].end():mraw[1].start()]))
          PY
