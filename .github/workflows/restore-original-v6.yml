name: Restore original QIQO v6

on:
  push:
    branches: [restore-v6]
    paths:
      - 'restore-v6-data/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-v6
          fetch-depth: 0

      - name: Reassemble and verify exact v6 archive
        shell: bash
        run: |
          set -euo pipefail
          cat restore-v6-data/chunk-* > /tmp/qiqo-v6.b64
          base64 --decode /tmp/qiqo-v6.b64 > /tmp/qiqo-v6.zip
          echo 'be30fc5064a8e007dcfde525975f80d0025125402086d7f3b0506e69f43c305a  /tmp/qiqo-v6.zip' | sha256sum -c -
          mkdir -p /tmp/qiqo-site
          unzip -q /tmp/qiqo-v6.zip -d /tmp/qiqo-site
          test -f /tmp/qiqo-site/assets/img/logo/qiqo-logo-2.png
          test -f /tmp/qiqo-site/assets/img/people/jose-luis-figueiredo.jpg
          test -f /tmp/qiqo-site/assets/img/people/paulo-andre.jpg
          test -f /tmp/qiqo-site/assets/img/labs/qulab.jpg
          test -f /tmp/qiqo-site/assets/img/labs/quantmatt-motlab.jpg
          ! grep -Fq 'Project status is calculated from the recorded end date' /tmp/qiqo-site/projects.html

      - name: Replace main with verified original v6
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rsync -a --delete --exclude='.git/' /tmp/qiqo-site/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore original QIQO website v6 with full-resolution assets'
          git push origin main
